# Demo scenario (OFF by default): a slow credential-stuffing run against the public login.
# Every username is "<first>.<last><two digits>"; seed usernames carry at most one digit, so no real demo
# account is locked and no customer row changes; the auth DB only answers "unknown user".
# Run:   kubectl apply -f tools/scenarios/credential-stuffing.yaml
# Stop:  kubectl delete -f tools/scenarios/credential-stuffing.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: scenario-credential-stuffing
  namespace: nusabank
data:
  script.js: |
    import http from "k6/http";
    import { sleep } from "k6";

    const BASE = __ENV.BASE_URL;
    const FIRST = ["andi", "budi", "citra", "dewi", "eka", "fitri", "gilang", "hendra", "indah", "joko", "kartika", "lestari", "made", "nadia", "oki", "putri", "rizky", "sinta", "tono", "wulan"];
    const LAST = ["saputra", "wijaya", "kusuma", "pratama", "santoso", "halim", "siregar", "lubis", "gunawan", "setiawan"];
    const PASSWORDS = ["Jakarta2024!", "Password123", "Bismillah1", "Indonesia45", "Sayang123!", "Rahasia2025"];

    export const options = {
      scenarios: {
        stuffing: { executor: "constant-arrival-rate", rate: 2, timeUnit: "1s", duration: __ENV.DURATION || "12m", preAllocatedVUs: 4 },
      },
    };

    export default function () {
      const i = Math.floor(Math.random() * 1e6);
      const username = `${FIRST[i % FIRST.length]}.${LAST[(i >> 5) % LAST.length]}${10 + (i % 90)}`;
      http.post(`${BASE}/api/auth/login`, JSON.stringify({ username, password: PASSWORDS[i % PASSWORDS.length] }), {
        headers: { "Content-Type": "application/json", "User-Agent": "Mozilla/5.0 (Linux; Android 13) okhttp/4.12.0" },
      });
      sleep(Math.random());
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: scenario-credential-stuffing
  namespace: nusabank
  labels:
    app: scenario-credential-stuffing
    app.kubernetes.io/name: scenario-credential-stuffing
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1200 # hard stop even if nobody deletes it
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: scenario-credential-stuffing
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:2.2.0
          args: [run, /scripts/script.js]
          env:
            - name: BASE_URL
              value: https://136-69-32-40.sslip.io
          volumeMounts:
            - { name: script, mountPath: /scripts }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: script
          configMap: { name: scenario-credential-stuffing }
