server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: admin-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:admin}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  flyway:
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

logging:
  structured:
    format:
      console: logstash

nusabank:
  jwt-secret: ${JWT_SECRET}
  operator-password: ${DEMO_OPERATOR_PASSWORD}
  auth-service-url: ${AUTH_SERVICE_URL:http://auth-service.nusabank.svc.cluster.local:8080}
  account-service-url: ${ACCOUNT_SERVICE_URL:http://account-service.nusabank.svc.cluster.local:8080}
  payment-service-url: ${PAYMENT_SERVICE_URL:http://payment-service.nusabank.svc.cluster.local:8080}
