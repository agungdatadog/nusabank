# Static SPA only. /api/* is routed to the backends by the GKE Ingress, so the browser
# sees a single origin (RUM trace headers flow, no CORS).
# JSON access log with the browser's trace id, so nginx lines join the RUM -> APM trace.
log_format json escape=json '{"time":"$time_iso8601","method":"$request_method","path":"$uri",'
  '"status":$status,"bytes":$body_bytes_sent,"duration_s":$request_time,'
  '"user_agent":"$http_user_agent","traceparent":"$http_traceparent"}';

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  access_log /dev/stdout json;

  location = /healthz { access_log off; return 200 'ok'; }

  # Written at container start from env (see 40-runtime-config.sh); never cached.
  location = /config.js {
    alias /tmp/config.js;
    add_header Cache-Control "no-store";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
