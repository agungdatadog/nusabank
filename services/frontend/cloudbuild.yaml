# Builds the frontend image and uploads its source maps to Datadog (RUM Error Tracking).
# Submit from the repo root so datadog-ci sees .git and links stack frames to GitHub:
#   gcloud builds submit . --region=asia-southeast2 --config=services/frontend/cloudbuild.yaml \
#     --ignore-file=services/frontend/cloudbuild.gcloudignore --substitutions=_VERSION=<ver>
substitutions:
  _IMAGE: asia-southeast2-docker.pkg.dev/datadog-ese-sandbox/indowebinar/frontend
steps:
  - id: build-stage
    name: gcr.io/cloud-builders/docker
    args: [build, --target, build, -t, frontend-build, services/frontend]
  - id: image
    name: gcr.io/cloud-builders/docker
    args: [build, -t, "${_IMAGE}:${_VERSION}", services/frontend]
  - id: extract-sourcemaps
    name: gcr.io/cloud-builders/docker
    entrypoint: sh
    args: [-c, "docker create --name fe frontend-build && docker cp fe:/app/sourcemaps /workspace/sourcemaps"]
  - id: upload-sourcemaps
    name: node:22.23.1-bookworm
    entrypoint: sh
    # service/version must match datadogRum.init; files are served under /assets.
    args:
      - -c
      - >-
        git config --global --add safe.directory /workspace &&
        npx --yes @datadog/datadog-ci@5.25.0 sourcemaps upload /workspace/sourcemaps/assets
        --service=nusabank-frontend --release-version=${_VERSION} --minified-path-prefix=/assets
    secretEnv: [DATADOG_API_KEY]
    env: [DATADOG_SITE=datadoghq.com]
images: ["${_IMAGE}:${_VERSION}"]
availableSecrets:
  secretManager:
    - versionName: projects/datadog-ese-sandbox/secrets/indowebinar-dd-api-key/versions/latest
      env: DATADOG_API_KEY
