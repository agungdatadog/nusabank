server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: account-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:account}
    username: ${DB_USER:account}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:redis.nusabank.svc.cluster.local}
      port: 6379
      password: ${REDIS_PASSWORD}
      timeout: 500ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:nusabank-kafka-kafka-bootstrap.nusabank.svc.cluster.local:9092}
    consumer:
      group-id: account-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

logging:
  structured:
    format:
      console: logstash

nusabank:
  jwt-secret: ${JWT_SECRET}
  partner-mock-url: ${PARTNER_MOCK_URL:http://partner-mock.nusabank.svc.cluster.local:8080}
  seed-file: ${SEED_FILE:/app/seed/customers.json}
  fx-cache-seconds: 60
  hold-ttl-minutes: 30
