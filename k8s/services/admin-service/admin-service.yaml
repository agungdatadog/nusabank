apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: admin-service
  namespace: nusabank
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: admin-service
  data:
    - secretKey: DB_PASSWORD
      remoteRef: { key: indowebinar-db-admin-password }
    - secretKey: JWT_SECRET
      remoteRef: { key: indowebinar-jwt-secret }
    - secretKey: DEMO_OPERATOR_PASSWORD
      remoteRef: { key: indowebinar-demo-operator-password }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-service
  namespace: nusabank
  labels: &labels
    app: admin-service
    app.kubernetes.io/name: admin-service
    app.kubernetes.io/part-of: nusabank
    tags.datadoghq.com/service: nusabank-admin
    tags.datadoghq.com/env: demo
    tags.datadoghq.com/version: "0.1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admin-service
  template:
    metadata:
      labels:
        <<: *labels
        admission.datadoghq.com/enabled: "true"
        nusabank.io/lang: java # opts in to SSI tracer injection
        # java-dogstatsd-client speaks UDP; hostip mode gives it DD_AGENT_HOST:8125.
        admission.datadoghq.com/config.mode: hostip
    spec:
      containers:
        - name: admin-service
          image: asia-southeast2-docker.pkg.dev/datadog-ese-sandbox/indowebinar/admin-service:0.1.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_HOST
              value: 10.70.0.6 # indowebinar-pg-channel (terraform/infra output cloudsql_private_ips)
            - name: DB_NAME
              value: admin
            - name: DB_USER
              value: admin
            - name: DD_LOGS_INJECTION
              value: "true"
            # Comments each SQL statement with the trace context: DBM query samples link to the APM trace.
            - name: DD_DBM_PROPAGATION_MODE
              value: full
            # Java/JDBC: without these, prepared statements fall back to service-only comments
            # (no traceparent), so DBM samples don't link to their traces.
            - name: DD_DBM_TRACE_PREPARED_STATEMENTS
              value: "true"
            - name: DD_INTEGRATION_JDBC_DATASOURCE_ENABLED
              value: "true"
            - name: DD_PROFILING_ENABLED
              value: "true"
            - name: DD_APPSEC_ENABLED
              value: "true"
            - name: DD_IAST_ENABLED
              value: "true"
          envFrom:
            - secretRef: { name: admin-service }
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 36
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: admin-service
  namespace: nusabank
  annotations:
    # Container-native load balancing: the GCE Ingress targets pod IPs directly.
    cloud.google.com/neg: '{"ingress": true}'
  labels:
    app: admin-service
    app.kubernetes.io/name: admin-service
spec:
  selector:
    app: admin-service
  ports:
    - name: http
      port: 8080
      targetPort: http
