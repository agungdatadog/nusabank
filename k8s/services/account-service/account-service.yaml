apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: account-service
  namespace: nusabank
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: account-service
  data:
    - secretKey: DB_PASSWORD
      remoteRef: { key: indowebinar-db-account-password }
    - secretKey: JWT_SECRET
      remoteRef: { key: indowebinar-jwt-secret }
    - secretKey: REDIS_PASSWORD
      remoteRef: { key: indowebinar-redis-password }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: nusabank
  labels: &labels
    app: account-service
    app.kubernetes.io/name: account-service
    app.kubernetes.io/part-of: nusabank
    tags.datadoghq.com/service: nusabank-account
    tags.datadoghq.com/env: demo
    tags.datadoghq.com/version: "0.1.4"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        <<: *labels
        admission.datadoghq.com/enabled: "true"
        nusabank.io/lang: java # opts in to SSI tracer injection
    spec:
      containers:
        - name: account-service
          image: asia-southeast2-docker.pkg.dev/datadog-ese-sandbox/indowebinar/account-service:0.1.4
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_HOST
              value: 10.70.0.7 # indowebinar-pg-core (terraform/infra output cloudsql_private_ips)
            - name: DB_NAME
              value: account
            - name: DB_USER
              value: account
            - name: DD_LOGS_INJECTION
              value: "true"
            - name: DD_PROFILING_ENABLED
              value: "true"
            - name: DD_DATA_STREAMS_ENABLED
              value: "true"
            - name: DD_DBM_PROPAGATION_MODE
              value: full
            - name: DD_APPSEC_ENABLED
              value: "true"
            - name: DD_IAST_ENABLED
              value: "true"
          envFrom:
            - secretRef: { name: account-service }
          resources:
            requests: { cpu: 300m, memory: 768Mi }
            limits: { cpu: "1500m", memory: 1Gi }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: account-service
  namespace: nusabank
  annotations:
    # Container-native load balancing: the GCE Ingress targets pod IPs directly.
    cloud.google.com/neg: '{"ingress": true}'
  labels:
    app: account-service
    app.kubernetes.io/name: account-service
spec:
  selector:
    app: account-service
  ports:
    - name: http
      port: 8080
      targetPort: http
