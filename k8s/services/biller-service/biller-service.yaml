apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: biller-service
  namespace: nusabank
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: biller-service
  data:
    - secretKey: DB_PASSWORD
      remoteRef: { key: indowebinar-db-biller-password }
    - secretKey: JWT_SECRET
      remoteRef: { key: indowebinar-jwt-secret }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: biller-service
  namespace: nusabank
  labels: &labels
    app: biller-service
    app.kubernetes.io/name: biller-service
    app.kubernetes.io/part-of: nusabank
    tags.datadoghq.com/service: nusabank-biller
    tags.datadoghq.com/env: demo
    tags.datadoghq.com/version: "0.1.2"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: biller-service
  template:
    metadata:
      labels:
        <<: *labels
        admission.datadoghq.com/enabled: "true"
        nusabank.io/lang: node # opts in to SSI tracer injection
        # Node's DogStatsD client speaks UDP; hostip mode gives it DD_AGENT_HOST:8125.
        admission.datadoghq.com/config.mode: hostip
    spec:
      containers:
        - name: biller-service
          image: asia-southeast2-docker.pkg.dev/datadog-ese-sandbox/indowebinar/biller-service:0.1.2
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_HOST
              value: 10.70.0.5 # indowebinar-mysql-partner (terraform/infra output cloudsql_private_ips)
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: biller
            - name: DB_USER
              value: biller
            - name: DD_LOGS_INJECTION
              value: "true"
            # Comments each SQL statement with the trace context: DBM query samples link to the APM trace.
            - name: DD_DBM_PROPAGATION_MODE
              value: full
            # kafkajs producer: pathway checkpoints for biller.payment.v1.
            - name: DD_DATA_STREAMS_ENABLED
              value: "true"
            - name: DD_RUNTIME_METRICS_ENABLED
              value: "true"
            - name: DD_PROFILING_ENABLED
              value: "true"
            - name: DD_APPSEC_ENABLED
              value: "true"
            - name: DD_IAST_ENABLED
              value: "true"
          envFrom:
            - secretRef: { name: biller-service }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 24
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000 # the node image's "node" user
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: biller-service
  namespace: nusabank
  annotations:
    # Container-native load balancing: the GCE Ingress targets pod IPs directly.
    cloud.google.com/neg: '{"ingress": true}'
  labels:
    app: biller-service
    app.kubernetes.io/name: biller-service
spec:
  selector:
    app: biller-service
  ports:
    - name: http
      port: 8080
      targetPort: http
