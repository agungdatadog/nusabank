apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-service
  namespace: nusabank
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: auth-service
  data:
    - secretKey: DB_PASSWORD
      remoteRef: { key: indowebinar-db-auth-password }
    - secretKey: JWT_SECRET
      remoteRef: { key: indowebinar-jwt-secret }
    - secretKey: DEMO_MFA_OTP
      remoteRef: { key: indowebinar-demo-mfa-otp }
    - secretKey: DEMO_CUSTOMER_PASSWORD
      remoteRef: { key: indowebinar-demo-customer-password }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: nusabank
  labels: &labels
    app: auth-service
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: nusabank
    tags.datadoghq.com/service: nusabank-auth
    tags.datadoghq.com/env: demo
    tags.datadoghq.com/version: "0.2.2"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        <<: *labels
        admission.datadoghq.com/enabled: "true"
        nusabank.io/lang: node # opts in to SSI tracer injection
        # Node's DogStatsD client speaks UDP; hostip mode gives it DD_AGENT_HOST:8125.
        admission.datadoghq.com/config.mode: hostip
    spec:
      containers:
        - name: auth-service
          image: asia-southeast2-docker.pkg.dev/datadog-ese-sandbox/indowebinar/auth-service:0.2.2
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_HOST
              value: 10.70.0.6 # indowebinar-pg-channel (terraform/infra output cloudsql_private_ips)
            - name: DB_NAME
              value: auth
            - name: DB_USER
              value: auth
            - name: DD_LOGS_INJECTION
              value: "true"
            - name: DD_RUNTIME_METRICS_ENABLED
              value: "true"
            - name: DD_PROFILING_ENABLED
              value: "true"
            - name: DD_APPSEC_ENABLED
              value: "true"
            - name: DD_IAST_ENABLED
              value: "true"
          envFrom:
            - secretRef: { name: auth-service }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 24
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000 # the node image's "node" user
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: nusabank
  labels:
    app: auth-service
    app.kubernetes.io/name: auth-service
spec:
  selector:
    app: auth-service
  ports:
    - name: http
      port: 8080
      targetPort: http
