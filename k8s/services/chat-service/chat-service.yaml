apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chat-service
  namespace: nusabank
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: chat-service
  data:
    - secretKey: MONGODB_PASSWORD
      remoteRef: { key: indowebinar-mongodb-chat-password }
    - secretKey: JWT_SECRET
      remoteRef: { key: indowebinar-jwt-secret }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: nusabank
  labels: &labels
    app: chat-service
    app.kubernetes.io/name: chat-service
    app.kubernetes.io/part-of: nusabank
    tags.datadoghq.com/service: nusabank-chat
    tags.datadoghq.com/env: demo
    tags.datadoghq.com/version: "0.2.1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        <<: *labels
        admission.datadoghq.com/enabled: "true"
        nusabank.io/lang: node # opts in to SSI tracer injection
        # Node's DogStatsD client speaks UDP; hostip mode gives it DD_AGENT_HOST:8125.
        admission.datadoghq.com/config.mode: hostip
    spec:
      containers:
        - name: chat-service
          image: asia-southeast2-docker.pkg.dev/datadog-ese-sandbox/indowebinar/chat-service:0.2.1
          ports:
            - name: http
              containerPort: 8080
          env:
            # Source Code Integration: links errors, traces and profiles to this commit on GitHub.
            # Must be the commit the image was built from — update it on every image bump.
            - name: DD_GIT_REPOSITORY_URL
              value: github.com/agungdatadog/nusabank
            - name: DD_GIT_COMMIT_SHA
              value: "2f468b4c3a5d712b6f9c95fc3061b9bd0e4150d5"
            - name: MONGODB_HOST
              value: mongodb.nusabank.svc.cluster.local:27017
            - name: MONGODB_DATABASE
              value: chat
            - name: MONGODB_USER
              value: chat
            # "faq": built-in answers. "agent": ai-agent (LLM, costs tokens) for every browser
            # session and for LOADGEN_AGENT_SHARE of load-generator sessions.
            - name: CHAT_RESPONDER
              value: agent
            # Back to 0 after EP1 to save tokens: load-generator chats get FAQ answers,
            # browser sessions still reach ai-agent. Raise it again before EP4 for LLM Obs history.
            - name: LOADGEN_AGENT_SHARE
              value: "0"
            - name: DD_LOGS_INJECTION
              value: "true"
            # Tags each MongoDB command with the trace context: DBM samples link to the APM trace.
            - name: DD_DBM_PROPAGATION_MODE
              value: full
            - name: DD_RUNTIME_METRICS_ENABLED
              value: "true"
            - name: DD_PROFILING_ENABLED
              value: "true"
            - name: DD_APPSEC_ENABLED
              value: "true"
            - name: DD_IAST_ENABLED
              value: "true"
          envFrom:
            - secretRef: { name: chat-service }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: "1", memory: 512Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 24
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000 # the node image's "node" user
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: nusabank
  annotations:
    # Container-native load balancing: the GCE Ingress targets pod IPs directly.
    cloud.google.com/neg: '{"ingress": true}'
  labels:
    app: chat-service
    app.kubernetes.io/name: chat-service
spec:
  selector:
    app: chat-service
  ports:
    - name: http
      port: 8080
      targetPort: http
