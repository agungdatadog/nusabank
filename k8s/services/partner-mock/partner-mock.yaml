# Single replica on purpose: scenario state and the SKN clearing queue are in memory,
# and one instance means a toggle applies to every call. A restart resets to healthy.
#
# Deliberately invisible to Datadog (AGENTS.md exception): it plays BI FAST, SKN, the PPOB
# aggregator, the credit bureau and the FX feed — third parties a bank never sees inside.
# No tracer, profiler, logs or metrics leave this pod, so an investigation stops at the
# callers' outbound spans, as it would in production. Operators read `kubectl logs`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: partner-mock
  namespace: nusabank
  labels: &labels
    app: partner-mock
    app.kubernetes.io/name: partner-mock
    app.kubernetes.io/part-of: nusabank
    app.kubernetes.io/version: "0.1.5"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: partner-mock
  template:
    metadata:
      labels:
        <<: *labels
      annotations:
        ad.datadoghq.com/exclude: "true" # no container logs or metrics from the Agent
    spec:
      containers:
        - name: partner-mock
          image: asia-southeast2-docker.pkg.dev/datadog-ese-sandbox/indowebinar/partner-mock:0.1.5
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DD_TRACE_ENABLED
              value: "false"
            - name: DD_INSTRUMENTATION_TELEMETRY_ENABLED
              value: "false"
            - name: SKN_WINDOW_MINUTES
              value: "15"
            - name: SKN_CUTOFF_MINUTES
              value: "2"
            - name: PAYMENT_SERVICE_URL
              value: http://payment-service.nusabank.svc.cluster.local:8080
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532 # distroless nonroot; numeric so the kubelet can verify it
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: partner-mock
  namespace: nusabank
  labels:
    app: partner-mock
    app.kubernetes.io/name: partner-mock
spec:
  selector:
    app: partner-mock
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# One host per partner, all served by partner-mock. Callers' outbound spans then show a
# partner gateway (out.host, peer.service) instead of a hostname that says "mock".
apiVersion: v1
kind: Service
metadata:
  name: ppob-gateway # PPOB biller aggregator — biller-service
  namespace: nusabank
  labels: { app: partner-mock, app.kubernetes.io/name: partner-mock }
spec:
  selector: { app: partner-mock }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: interbank-gateway # BI FAST and SKN — payment-service
  namespace: nusabank
  labels: { app: partner-mock, app.kubernetes.io/name: partner-mock }
spec:
  selector: { app: partner-mock }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: credit-bureau-gateway # credit checks — loan-service
  namespace: nusabank
  labels: { app: partner-mock, app.kubernetes.io/name: partner-mock }
spec:
  selector: { app: partner-mock }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: fx-gateway # FX rate feed — account-service
  namespace: nusabank
  labels: { app: partner-mock, app.kubernetes.io/name: partner-mock }
spec:
  selector: { app: partner-mock }
  ports: [{ name: http, port: 8080, targetPort: http }]
