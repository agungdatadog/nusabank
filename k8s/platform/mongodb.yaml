# chat-service store. PVC-backed — never emptyDir (see AGENTS.md).
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: nusabank
  labels:
    app: mongodb
    app.kubernetes.io/name: mongodb
spec:
  clusterIP: None
  selector:
    app: mongodb
  ports:
    - name: mongodb
      port: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: nusabank
  labels:
    app: mongodb
    app.kubernetes.io/name: mongodb
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
        app.kubernetes.io/name: mongodb
        tags.datadoghq.com/service: nusabank-mongodb
        tags.datadoghq.com/env: demo
        tags.datadoghq.com/version: "8.0.30"
    spec:
      containers:
        - name: mongodb
          image: mongo:8.0.30
          args: ["--bind_ip_all", "--wiredTigerCacheSizeGB", "0.5"]
          ports:
            - containerPort: 27017
              name: mongodb
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: root
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: platform-credentials, key: MONGODB_ROOT_PASSWORD }
          resources:
            requests: { cpu: 200m, memory: 768Mi }
            limits: { cpu: "1", memory: 1Gi }
          livenessProbe:
            tcpSocket: { port: 27017 }
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: premium-rwo
        resources:
          requests:
            storage: 20Gi
