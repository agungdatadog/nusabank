# Secret Manager → Kubernetes Secrets. Secret values never appear in this repo;
# rotating a value in Secret Manager propagates within refreshInterval.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: datadog-ese-sandbox
      auth:
        workloadIdentity:
          clusterLocation: asia-southeast2
          clusterName: indowebinar-gke
          clusterProjectID: datadog-ese-sandbox
          serviceAccountRef:
            name: external-secrets
            namespace: nusabank
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: datadog-secret
  namespace: datadog
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: datadog-secret
  data:
    - secretKey: api-key
      remoteRef: { key: indowebinar-dd-api-key }
    - secretKey: app-key
      remoteRef: { key: indowebinar-dd-app-key }
---
# Read by the agent's secret backend through ENC[k8s_secret@datadog/datadog-dbm/<key>].
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: datadog-dbm
  namespace: datadog
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: datadog-dbm
  data:
    - secretKey: pg-core
      remoteRef: { key: indowebinar-db-pg-core-datadog-password }
    - secretKey: pg-channel
      remoteRef: { key: indowebinar-db-pg-channel-datadog-password }
    - secretKey: mysql-partner
      remoteRef: { key: indowebinar-db-mysql-partner-datadog-password }
    - secretKey: mongodb
      remoteRef: { key: indowebinar-mongodb-datadog-password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-bootstrap
  namespace: nusabank
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: db-bootstrap
  data:
    - secretKey: PG_CORE_ADMIN_PASSWORD
      remoteRef: { key: indowebinar-db-pg-core-admin-password }
    - secretKey: PG_CHANNEL_ADMIN_PASSWORD
      remoteRef: { key: indowebinar-db-pg-channel-admin-password }
    - secretKey: MYSQL_PARTNER_ADMIN_PASSWORD
      remoteRef: { key: indowebinar-db-mysql-partner-admin-password }
    - secretKey: MYSQL_PARTNER_DATADOG_PASSWORD
      remoteRef: { key: indowebinar-db-mysql-partner-datadog-password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-credentials
  namespace: nusabank
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: platform-credentials
  data:
    - secretKey: MONGODB_ROOT_PASSWORD
      remoteRef: { key: indowebinar-mongodb-root-password }
    # Users created by mongo-bootstrap.yaml.
    - secretKey: MONGODB_CHAT_PASSWORD
      remoteRef: { key: indowebinar-mongodb-chat-password }
    - secretKey: MONGODB_DATADOG_PASSWORD
      remoteRef: { key: indowebinar-mongodb-datadog-password }
    - secretKey: REDIS_PASSWORD
      remoteRef: { key: indowebinar-redis-password }
