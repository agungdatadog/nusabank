# One agent config for every Datadog pillar the series demonstrates.
# The Admission Controller injects DD_AGENT_HOST / DD_ENV / DD_SERVICE / DD_VERSION
# into pods labelled admission.datadoghq.com/enabled: "true" — services never hand-write them.
apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog
  namespace: datadog
spec:
  global:
    site: datadoghq.com
    clusterName: indowebinar-gke
    credentials:
      apiSecret:
        secretName: datadog-secret
        keyName: api-key
      appSecret:
        secretName: datadog-secret
        keyName: app-key
    tags:
      - env:demo
      - team:indowebinar
    # Resolves ENC[k8s_secret@datadog/datadog-dbm/<key>] in check configs.
    secretBackend:
      command: /readsecret_multiple_providers.sh
      roles:
        - namespace: datadog
          secrets: [datadog-dbm]

  features:
    apm:
      enabled: true
      hostPortConfig:
        enabled: true
      unixDomainSocketConfig:
        enabled: true
      # Single Step Instrumentation: tracers are injected, not baked into images.
      # Opt-in by pod label so Go, Kafka, MongoDB and Redis pods get no init containers.
      # Go services (payment, partner-mock) are compiled with dd-trace-go instead.
      instrumentation:
        enabled: true
        targets:
          - name: java
            namespaceSelector:
              matchNames: [nusabank]
            podSelector:
              matchLabels:
                nusabank.io/lang: java
            ddTraceVersions:
              java: "v1.66.0"
          - name: node
            namespaceSelector:
              matchNames: [nusabank]
            podSelector:
              matchLabels:
                nusabank.io/lang: node
            ddTraceVersions:
              js: "v6.17.0"
          - name: python
            namespaceSelector:
              matchNames: [nusabank]
            podSelector:
              matchLabels:
                nusabank.io/lang: python
            ddTraceVersions:
              python: "v4.13.3"
    dogstatsd:
      hostPortConfig:
        enabled: true
      unixDomainSocketConfig:
        enabled: true
    logCollection:
      enabled: true
      containerCollectAll: true
    liveProcessCollection:
      enabled: true
    npm:
      enabled: true
    usm:
      enabled: true
    admissionController:
      enabled: true
      mutateUnlabelled: false
    clusterChecks:
      enabled: true
      useClusterChecksRunners: true
    orchestratorExplorer:
      enabled: true
    kubeStateMetricsCore:
      enabled: true
    eventCollection:
      collectKubernetesEvents: true
    remoteConfiguration:
      enabled: true

  override:
    nodeAgent:
      image:
        tag: "7.83.3"
      containers:
        trace-agent:
          env:
            # Drop probe spans for every language in one place.
            - name: DD_APM_IGNORE_RESOURCES
              value: "^(GET|HEAD) /(healthz|readyz)$"
        agent:
          env:
            # The bundled redisdb auto_conf connects without a password and fails on our
            # requirepass Redis; the cluster check below replaces it.
            - name: DD_IGNORE_AUTOCONF
              value: "redisdb"
    clusterAgent:
      image:
        tag: "7.83.3"
      # DBM for Cloud SQL runs as cluster checks: one runner owns each instance.
      # Hosts are terraform/infra output cloudsql_private_ips.
      extraConfd:
        configDataMap:
          postgres.yaml: |-
            cluster_check: true
            init_config:
            instances:
              - dbm: true
                host: 10.70.0.7
                port: 5432
                username: datadog
                password: ENC[k8s_secret@datadog/datadog-dbm/pg-core]
                dbname: postgres
                database_autodiscovery:
                  enabled: true
                gcp:
                  project_id: datadog-ese-sandbox
                  instance_id: indowebinar-pg-core
                # Schemas view, column stats and per-table metrics (DBM Cloud SQL guide).
                collect_schemas:
                  enabled: true
                collect_column_statistics:
                  enabled: true
                relations:
                  - relation_regex: .*
                tags:
                  - env:demo
                  - dbinstance:indowebinar-pg-core
              - dbm: true
                host: 10.70.0.6
                port: 5432
                username: datadog
                password: ENC[k8s_secret@datadog/datadog-dbm/pg-channel]
                dbname: postgres
                database_autodiscovery:
                  enabled: true
                gcp:
                  project_id: datadog-ese-sandbox
                  instance_id: indowebinar-pg-channel
                # Schemas view, column stats and per-table metrics (DBM Cloud SQL guide).
                collect_schemas:
                  enabled: true
                collect_column_statistics:
                  enabled: true
                relations:
                  - relation_regex: .*
                tags:
                  - env:demo
                  - dbinstance:indowebinar-pg-channel
          mysql.yaml: |-
            cluster_check: true
            init_config:
            instances:
              - dbm: true
                host: 10.70.0.5
                port: 3306
                username: datadog
                password: ENC[k8s_secret@datadog/datadog-dbm/mysql-partner]
                gcp:
                  project_id: datadog-ese-sandbox
                  instance_id: indowebinar-mysql-partner
                collect_schemas:
                  enabled: true
                tags:
                  - env:demo
                  - dbinstance:indowebinar-mysql-partner
          # Kafka Console (DSM → Kafka): the Kafka Consumer check with cluster monitoring
          # collects topics, partitions, configs, consumer lag and lets Kafka actions read
          # messages (Remote Configuration is on). Strimzi listener "plain": no TLS, no auth,
          # no ACLs. Requires Agent 7.78+.
          kafka_consumer.yaml: |-
            cluster_check: true
            init_config:
            instances:
              - kafka_connect_str: nusabank-kafka-kafka-bootstrap.nusabank.svc.cluster.local:9092
                monitor_unlisted_consumer_groups: true
                enable_cluster_monitoring: true
                tags:
                  - env:demo
                  - kafka_cluster:nusabank-kafka
          # In-cluster Redis (account-service FX cache).
          redisdb.yaml: |-
            cluster_check: true
            init_config:
            instances:
              - host: redis.nusabank.svc.cluster.local
                port: 6379
                password: ENC[k8s_secret@datadog/datadog-dbm/redis]
                command_stats: true
                tags:
                  - env:demo
                  - service:nusabank-redis
          # In-cluster MongoDB (chat-service), per the DBM self-hosted MongoDB guide.
          # Users and query stats sampling come from k8s/platform/mongo-bootstrap.yaml.
          mongo.yaml: |-
            cluster_check: true
            init_config:
            instances:
              - dbm: true
                hosts:
                  - mongodb.nusabank.svc.cluster.local:27017
                username: datadog
                password: ENC[k8s_secret@datadog/datadog-dbm/mongodb]
                options:
                  authSource: admin
                tls: false # cluster-internal; no TLS configured on this mongod
                cluster_name: nusabank-mongodb
                reported_database_hostname: mongodb.nusabank
                additional_metrics: ["metrics.commands", "tcmalloc", "top", "collection"]
                collections_indexes_stats: true
                database_autodiscovery:
                  enabled: true
                  include: ["^chat$"]
                query_metrics:
                  enabled: true
                tags:
                  - env:demo
                  - dbinstance:nusabank-mongodb
    clusterChecksRunner:
      image:
        tag: "7.83.3"
      replicas: 2
